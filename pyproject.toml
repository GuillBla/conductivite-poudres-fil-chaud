[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotwire"
version = "2.0.0"
description = "Mesure de la conductivité thermique des poudres par fil chaud : simulation, acquisition Arduino et analyse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=7", "pyserial>=3.5"]

[project.scripts]
hotwire = "hotwire.cli:main"

[tool.setuptools]
packages = ["hotwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
